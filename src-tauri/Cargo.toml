[package]
name = "syrion-cut"
version = "1.0.0"
description = "Syrion Cut: removes image backgrounds automatically"
edition = "2021"

[lib]
name = "syrion_cut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Image maths is painfully slow without optimisation, even in dev builds.
[profile.dev.package."*"]
opt-level = 3
